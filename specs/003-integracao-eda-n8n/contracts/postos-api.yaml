openapi: 3.1.0
info:
  title: Consulta de postos ANP ao longo da rota
  version: 1.0.0
paths:
  /api/v1/postos/ao-longo-da-rota:
    post:
      summary: Lista postos no raio da polilinha
      description: >-
        Ordena por avaliação decrescente (nulos ao final), anos de autorização
        decrescentes e distância crescente. Usa o CNPJ em ordem crescente em caso
        de empate nos três critérios. O catálogo é lido no primeiro uso e mantido
        em memória. O ambiente local pode usar postos fictícios quando não há base real.
      security:
        - sessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaPostos'
      responses:
        '200':
          description: Postos ranqueados e data de referência da base, mesmo quando a lista está vazia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoPostos'
        '401':
          description: Sessão ausente, inválida ou expirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPostos'
        '422':
          description: Entrada inválida. A resposta omite os valores enviados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPostos'
        '503':
          description: Catálogo indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPostos'
components:
  securitySchemes:
    sessao:
      type: apiKey
      in: cookie
      name: guia_turista_session
  schemas:
    ConsultaPostos:
      type: object
      additionalProperties: false
      required: [geometria]
      properties:
        geometria:
          type: array
          minItems: 2
          maxItems: 10000
          description: Pares [latitude, longitude] no recorte geográfico do Brasil.
          items:
            type: array
            minItems: 2
            maxItems: 2
            prefixItems:
              - { type: number, minimum: -33.75, maximum: 5.27 }
              - { type: number, minimum: -73.99, maximum: -34.79 }
        raio_km:
          type: number
          exclusiveMinimum: 0
          maximum: 5
          default: 2
    ResultadoPostos:
      type: object
      additionalProperties: false
      required: [postos, data_reference_date]
      properties:
        postos:
          type: array
          items:
            $ref: '#/components/schemas/PostoRanqueado'
        data_reference_date: { type: string, format: date }
    PostoRanqueado:
      type: object
      additionalProperties: false
      required:
        - cnpj
        - legal_name
        - rating
        - authorized_since
        - authorization_years
        - fuels
        - latitude
        - longitude
        - distance_from_route_km
        - rank
      properties:
        cnpj:
          type: string
          pattern: '^[0-9]{2}\.[0-9]{3}\.[0-9]{3}/[0-9]{4}-[0-9]{2}$'
        legal_name: { type: string, minLength: 1 }
        rating: { type: [number, 'null'], minimum: 0, maximum: 5 }
        authorized_since: { type: string, format: date }
        authorization_years: { type: integer, minimum: 0 }
        fuels:
          type: array
          items: { type: string }
        latitude: { type: number, minimum: -33.75, maximum: 5.27 }
        longitude: { type: number, minimum: -73.99, maximum: -34.79 }
        distance_from_route_km:
          type: number
          minimum: 0
          description: Distância aproximada ao segmento da rota mais próximo, em quilômetros.
        rank: { type: integer, minimum: 1 }
    ErroPostos:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail: { type: string }
